[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaphor-goodm"
version = "1.0.0"
description = "GoodM - Metaphor Generation, Evaluation, and Analysis System"
readme = "README.md"
authors = [
    { name = "Author", email = "author@example.com" }
]

[project.dependencies]
python = ">=3.8"
pandas = "^2.0.0"
numpy = "^1.24.0"
transformers = "^4.30.0"
sentence-transformers = "^2.2.0"
dashscope = "^1.20.0"
openai = "^1.12.0"
anthropic-api = "^0.0.0"
torch = "^2.0.0"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.8"
strict = true