[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaphor-goodm"
version = "1.0.0"
description = "GoodM - seven-tuple construction and evaluation for Chinese two-part allegorical sayings"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
    # SRL for Phi_EE (Appendix E, Operator 1).
    "ltp>=4.2",
    # Sememe retrieval for Phi_EE / Phi_VE / Phi_C.
    "OpenHowNet",
]

[project.optional-dependencies]
# Only needed when running the pipeline with an actual LLM backend.
llm = [
    "openai>=1.12",
    "dashscope>=1.20",
]
# BERTScore and DeepMet-S evaluation (RQ6).
metrics = [
    "torch>=2.1",
    "transformers>=4.36",
    "bert-score>=0.3.13",
]

[tool.setuptools.packages.find]
include = [
    "core*", "operators*", "constraints*", "embeddings*",
    "datasets*", "experiments*", "llm_wrappers*",
]
